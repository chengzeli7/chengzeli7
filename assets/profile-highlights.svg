<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="profile highlights">
  <style>
    .bg { fill: #0d1117; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .title { fill: #58a6ff; font: 700 15px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; }
    .text { fill: #c9d1d9; font: 600 13px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; }
    .muted { fill: #8b949e; font: 12px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; }
  </style>
  <rect class="bg" width="900" height="150" rx="8"/>
  <g transform="translate(18 18)">
    <rect class="card" width="132" height="112" rx="8"/>
    <text class="title" x="18" y="34">Kotlin</text>
    <text class="text" x="18" y="62">Android-first</text>
    <text class="muted" x="18" y="88">mobile apps</text>
  </g>
  <g transform="translate(162 18)">
    <rect class="card" width="132" height="112" rx="8"/>
    <text class="title" x="18" y="34">Offline</text>
    <text class="text" x="18" y="62">local data</text>
    <text class="muted" x="18" y="88">privacy minded</text>
  </g>
  <g transform="translate(306 18)">
    <rect class="card" width="132" height="112" rx="8"/>
    <text class="title" x="18" y="34">Tools</text>
    <text class="text" x="18" y="62">utilities</text>
    <text class="muted" x="18" y="88">reusable code</text>
  </g>
  <g transform="translate(450 18)">
    <rect class="card" width="132" height="112" rx="8"/>
    <text class="title" x="18" y="34">Product</text>
    <text class="text" x="18" y="62">small ideas</text>
    <text class="muted" x="18" y="88">usable apps</text>
  </g>
  <g transform="translate(594 18)">
    <rect class="card" width="132" height="112" rx="8"/>
    <text class="title" x="18" y="34">Frontend</text>
    <text class="text" x="18" y="62">TypeScript</text>
    <text class="muted" x="18" y="88">experiments</text>
  </g>
  <g transform="translate(738 18)">
    <rect class="card" width="132" height="112" rx="8"/>
    <text class="title" x="18" y="34">Workflow</text>
    <text class="text" x="18" y="62">GitHub</text>
    <text class="muted" x="18" y="88">AI-assisted</text>
  </g>
</svg>
